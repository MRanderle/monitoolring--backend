services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: monitoolring-backend:local
    container_name: monitoolring-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - monitoolring

networks:
  monitoolring:
    name: monitoolring-network
    external: true
